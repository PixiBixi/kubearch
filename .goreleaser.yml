version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: kubearch
    binary: kubearch
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s   # implique -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

upx:
  - enabled: true
    ids: [kubearch]
    compress: best
    lzma: true
    goos: [linux]

kos:
  - id: kubearch
    # Go 1.27 rejects `go list ""` ("invalid package"), which ko does when this
    # is left to default off the build. Must stay explicit.
    main: .
    repositories:
      - ghcr.io/pixibixi/kubearch
    base_image: gcr.io/distroless/static:nonroot
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - '{{ if not .Prerelease }}latest{{ end }}'
    bare: true

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE*

# syft runs over each archive, so the release carries what is inside the
# artifact, not just how it was built. The provenance attestation in
# release.yml covers these files too, so a swapped SBOM does not verify.
sboms:
  - artifacts: archive

# Keyless, so there is no private key to store or rotate: the identity comes
# from the GitHub OIDC token and lands in the Sigstore transparency log.
#
# Signing checksums.txt covers every archive at once, since it holds their
# SHA256. cosign v3 writes one .sigstore.json bundle instead of the old .sig
# plus .pem pair, so verification is
# `cosign verify-blob --bundle <file>.sigstore.json`.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'typo'
  groups:
    - title: Features
      regexp: '^feat:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix:'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: "PixiBixi"
    name: kubearch
  name_template: "{{.ProjectName}} {{.Version}}"
  draft: false
  prerelease: auto
  mode: replace
