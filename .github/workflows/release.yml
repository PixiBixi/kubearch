name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write  # required to push to ghcr.io
    steps:
      # audit, not block: this job's egress (goreleaser uploads, the OCI
      # registry push) moves with every dependency, and a stale allowlist
      # would fail the release after the archives are already built.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Needed by svu below, and by GoReleaser further down.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # release publishes artifacts; avoid cache-poisoning vector

      # svu derives the next version from the conventional commits since the
      # last tag, and prints the current one back when nothing warrants a
      # release -- which is the gate below. --v0 keeps a breaking change on a
      # 0.x project from jumping straight to v1.0.0.
      - name: Compute next version
        id: tag
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # renovate: datasource=github-releases depName=caarlos0/svu
          SVU_VERSION: v3.4.1
        run: |
          set -euo pipefail
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/caarlos0/svu/v3@${SVU_VERSION}"
          svu="${RUNNER_TEMP}/bin/svu"

          current=$("$svu" current)
          next=$("$svu" next --v0)
          if [ "$next" = "$current" ]; then
            echo "No releasable commit since ${current}, nothing to do."
            exit 0
          fi

          echo "Tagging ${next} (previous: ${current})"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next}" -f "sha=${GITHUB_SHA}" --silent
          echo "new_tag=${next}" >> "$GITHUB_OUTPUT"

      # The tag was created through the API, so the local clone needs it before
      # GoReleaser can read the version off it.
      - name: Fetch tags
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        run: git fetch --tags --force

      - name: Run GoReleaser
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to OCI
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        env:
          # On a tag push the ref is the tag itself; on a main push it is the
          # tag github-tag-action just created.
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || steps.tag.outputs.new_tag }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHART_VERSION="${RELEASE_TAG#v}"
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GHCR_USER" \
            --password-stdin
          helm package charts/kubearch \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION"
          helm push "kubearch-${CHART_VERSION}.tgz" oci://ghcr.io/pixibixi/kubearch/charts
